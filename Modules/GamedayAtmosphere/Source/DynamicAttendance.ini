[Attendance]
Enabled=1

; Auto selects the table for each game. Other options: Default, Reduced, BadWeather.
Profile=Auto

[Audio]
; Match crowd volume to the fans remaining. Other audio and saved sliders stay unchanged.
Enabled=1
; Audio reduction strength: 0 = no reduction, 35 = gentle, 100 = original strong curve.
Strength=35
; Chant reduction: 100 uses the tested level at half attendance; 0 disables it.
; Smaller crowds keep that level while fans remain. Does not change band or PA audio.
ChantStrength=100
