[General]

; Gameday Atmosphere - Ace
; 1 = on, 0 = off, unless a setting says otherwise.
; Visible attendance percentages use the crowd the game planned for this matchup.
; Sound percentages use how full the mapped stands actually are.
; Volume percentages change the audio signal, not a literal count of voices.
; Make a backup before editing. Restart MMC and the game after updating the DLL.

; Update markers used by the plugin. Leave these numbers alone.
ConfigVersion=2

; The final Update 3 release resets older/test-build INIs once, with a backup. Later edits are preserved.
; Do not remove or lower this marker; doing so repeats the reset.
SettingsResetVersion=4

; Tracks audio settings upgrades; do not lower this to repeat an update.
AudioBalanceVersion=59

; Tracks attendance settings upgrades; do not change this manually.
AttendanceBalanceVersion=9

; Tracks replay settings upgrades; do not change this manually.
ReplayBalanceVersion=1

[Dynamic Gameday Attendance]
; Assign visiting fans using fanbase strength, distance and rivalry. Choose before loading.
DynamicAwayCrowds=1
; New fixture plans only: 100 = normal model, 0 = minimum presence,
; 200 = stronger traveling support. Neutral venues and saved plans stay intact.
VisitorCrowdInfluencePercent=100

; Empty stadium override; mutes collective crowd, bands, drums and PA announcer.
; Quiet individual details remain beneath the native player/field sounds.
; Adds the auditioned outdoor ambience/reverb-return treatment during field scenes.
; Disabled by default. Switch off to restore normal attendance and audio.
2020ModeEnabled=0

; New regular-season Dynasty launches estimate interested fans from a saved audience
; foundation, evolving prestige/atmosphere, completed seasons and AP rank.
; Matchup, rivalry, local kickoff time and weather adjust that game's audience.
; Foundations stay in this plugin's History folder; game saves are never changed.
; Postseason, practice, unsupported inputs and existing/resumed games keep EA turnout.
; Advanced switch; takes effect on the next fresh game launch. Menu master still applies.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
InitialAttendanceEnabled=1
; Ordinary kickoff is 50-65% of expected peak; severe-late baseline 45%.
; Regular usual ceiling 70%, exceptional cap 80%, weather-only floor 35%; postseason 70-80%, championships 80-90%.
; Legacy values are fallback controls when revised native inputs are unavailable.

; Enables changing crowds and the sound that follows their attendance.
; Turning this off does not turn off the separate extra-replay options below.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
Enabled=1

; Auto chooses the crowd-departure profile from the matchup and weather.
; Optional fixed profiles: Default, Reduced (more patient), BadWeather (less patient).
; This affects departures, not which games get audio buildup.
Profile=Auto

; Attendance Profile: 1 = Default, 0 = Fuller Crowds.
; Fuller adds8 capacity points to the fresh regular-season Dynasty peak target
; and7 points to the kickoff share, keeping existing weather/caps.
; Postseason peaks and a game already in progress are unchanged.
AttendanceProfile=1

; How strongly score, clock and matchup encourage permanent departures: 0-200.
; 100 = normal, 50 = gentler, 200 = stronger, 0 = no formula departures.
; Temporary seat breaks and the separate late-score rule have their own controls.
; Guide: Default 100; range 0-200 % of normal formula strength; whole numbers only.
; Guide: Higher = stronger formula departures; lower = gentler. 0 disables formula pressure, but separately configured event exits/seat breaks remain.
FormulaStrength=100

; Standard permanent-departure limit in one ordinary quarter: 1-50 points
; of the original crowd. Hopeless late home blowouts can use the limited extra
; allowance below. Postseason games keep their own lower limits.
; Guide: Default 45; range 1-50 points of original attendance; whole numbers only.
; Guide: Higher = more permanent departures allowed per quarter; lower = a smaller maximum. Postseason caps can be stricter.
MaximumDeparturePerQuarter=45

; Base size of a visible crowd-change step at a safe break: 1-20 points.
; Longer waits allow larger steps; halftime returns and arrivals use this too.
; Built-up permanent departures can catch up faster. Quarter limits still apply.
; Guide: Default 4; range 1-20 points of original attendance; whole numbers only.
; Guide: Higher = larger basic hidden seat-change steps; lower = gentler steps. Catch-up allowances can exceed this base step.
MaximumDeparturePerTransition=4

; How far behind the home team must have been before a comeback can buy patience.
; Example: 21 means it must have trailed by at least three touchdowns. Range: 14-100.
; Guide: Default 21; range 14-100 score points; whole numbers only.
; Guide: Higher = a team must have fallen farther behind for comeback protection; lower = smaller earlier deficits can qualify.
ComebackOriginalDeficit=21

; Points made up before that comeback can help keep fans interested. Range: 7-100.
; Guide: Default 14; range 7-100 score points; whole numbers only.
; Guide: Higher = a larger rally is needed to protect retention; lower = protection can start sooner.
ComebackPointsRecovered=14

; Game-clock seconds of a deteriorating comeback before that protection ends.
; Based on 12-minute quarters and adjusted for your quarter length. Range: 0-600.
; Guide: Default 60; range 0-600 reference game seconds (12-minute quarters); whole numbers only.
; Guide: Higher = a fading comeback keeps protection longer; lower = it loses protection sooner. Scales with quarter length.
ComebackDeteriorationSeconds=60

; Adds a departure decision at the next safe break after Q4 reaches 2:00.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
TwoMinuteWarning=1

; Extra original-crowd points who may leave after a late opponent score: 0-25.
; Applies in Q4's final two minutes when home trails by 9+ with 0-1 timeouts.
; Postseason and neutral-site games are excluded. Set 0 to disable this rule.
; Guide: Default 5; range 0-25 points of original attendance; whole numbers only.
; Guide: Higher = a larger extra exit group after a qualifying late opponent score; lower = smaller. 0 disables this event group.
LateScoreExtra=5

; Home deficits of 17+ begin traffic departures in the last third of Q4.
; Uses the deficit, time left, possession, timeouts and recent home scoring.
; Deficits of 28+ can start gently in the last half, then ramp up in the last third.
; With 12-minute quarters: 4:00 normally, or a gentle start at 6:00 for 28+.
; It moves toward one target, not another repeated percentage cut. 0 disables this acceleration.
; Existing crowd floors, quarter caps and hidden seat-update windows still apply.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
LateTrafficEnabled=1

; Extra points allowed beyond the standard Q4 departure cap when the home team
; trails by 28+ in the late traffic window (gentle last-half start, stronger last third).
; Scales with deficit, time remaining and recovery outlook; never refills a crowd.
; Existing crowd floors, comeback protection and hidden updates still apply.
; Does not apply to neutral venues or postseason games. Requires LateTrafficEnabled.
; Default 10; range 0-10 percentage points of ORIGINAL attendance, not remaining fans.
; Higher = more late-blowout departures allowed; 0 keeps the standard quarter cap absolute.
LateTrafficExtraQuarterAllowance=10

; Maximum extra original-crowd points after a costly late home interception/lost fumble: 0-15.
; Default 10. A smaller chance-changing turnover gets fewer; hopeful games get none.
; A same-play late score and turnover use the larger group, never both added together.
; Neutral sites and postseason are excluded. 0 disables the turnover-specific group.
; Guide: Default 10; range 0-15 points of original attendance; whole numbers only.
; Guide: Higher = a larger possible exit group after a costly late home turnover; lower = smaller. 0 disables this group.
LateTurnoverExtraMax=10

; Starts with some seats empty and fills toward the game's original crowd in Q1.
; Turning this off skips late arrivals; it does not force the game to sell out.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
ArrivalsEnabled=1

; Advanced fallback baselines when native grade-based turnout is unavailable/disabled.
; Revised fresh launches calculate 50-60% of peak by demand; night adds up to 5.
; Guide: Default 55; range 50-60 % of planned crowd; whole numbers only.
StartPercent=55

; Severe-late homes: UCLA, Miami (FL), Georgia Tech, Maryland and Utah.
; Guide: Default 45; range 40-50 % of planned crowd; whole numbers only.
LateSchoolStartPercent=45

; Ordinary arrivals finish halfway through Q1; revised marquee games use 30%.
; Guide: Default 50; range 10-100 % of Q1 elapsed; whole numbers only.
FinishPercentOfQuarter=50

; Severe-late arrivals finish three quarters through Q1; neutral games use standard timing.
; Guide: Default 75; range 10-100 % of Q1 elapsed; whole numbers only.
LateSchoolFinishPercentOfQuarter=75

; Advanced fallback bonus for qualifying big games, including ranked rivalries.
; Guide: Default 3; range 0-3 points of planned crowd; whole numbers only.
BigGameBonus=3

; Fallback rain/snow delay. Only weather may take kickoff below 40%; hard floor 35%.
; Revised launches use precipitation intensity: 3/5/8 points, with indoor exemption.
; Guide: Default 5; range 0-8 points of planned crowd; whole numbers only.
BadWeatherPenalty=5

; 100 temporarily removes 20-30% of the fans still present, subject to crowd floors.
; Seeded departures begin in the last 20-30% of Q2; two return waves finish
; 15-25% and 25-35% through Q3. Close big/packed games wait mostly for halftime.
; Changes wait for hidden breaks/play selection. 0 disables; max 200 doubles the share.
; Guide: Default 100; range 0-200 % of the normal temporary share; whole numbers only.
; Guide: Higher = more fans temporarily leave their seats; lower = fewer. 0 disables temporary breaks; floors still apply.
HalftimeSeatBreakStrength=100

; Some halftime seat-breakers stay gone when an ordinary home game turns ugly.
; 0 disables it; default/max 25. At an 18-point home deficit the share is about 20%,
; rising smoothly to 25% at 28+ points. It fades out as fewer than 90% of fans remain,
; and is off at 80% remaining. Both temporary and seated fans count as still present.
; Excludes big/postseason and neutral games. Crowd floors and quarter caps still apply.
; The seats are already empty: fewer fans return, rather than another visible crowd cut.
; Guide: Default 25; range 0-25 %; whole numbers only.
; Guide: Higher = more eligible halftime seat-breakers stay gone permanently; lower = fewer. 0 disables this conversion.
HalftimeDepartureConversionPercent=25

[Dynamic Gameday Soundscape]

; Enables seating-fullness-based volume and the added crowd audio system.
; Soundscape waits for a verified seating measurement; attendance percentages are separate.
; Visual attendance and extra replay frequency remain separate.
; Turning this off retires the added mix and reactions. Native callback support
; stays installed so 2020 Mode and live Soundscape toggles remain available.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
Enabled=1

; Crowd volume now uses one synchronized native bus mix. No native excitement
; limiting or graph-volume parameter attenuation is applied.
; Automatic clips follow their recorded crowd. Pauses/interactive replay restore native bus gains.
; Vanilla crossover
; varies from70% fullness at6060 mapped seats to30% at61888 mapped seats.
; Beds/Chants fade together; Reactions and individual detail have their own
; rounded nonzero signal floors: Beds/Chants40%, Reactions55%, individual detail95%.
; The smallest venue at25% fullness requests50% background. Zero explicitly mutes Crowd.
; Native-bus mix strength: 0-100. Default100 uses the full normal density curve.
; Lower stays closer to native levels; 0 keeps native volume except empty stands.
CrowdMixStrengthPercent=100
; The following three legacy keys are preserved for compatibility and ignored.
ReductionStartPercent=50
NativeQuietingStrengthPercent=100
CrowdVolumeReductionPercent=25

; Enables added roar/cheer layers, extra excitement, shake and volume boosts.
; Visual attendance is separate. The native bus mix follows occupied seats and fullness.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
LayeredAtmosphereEnabled=1

; Enables the extra long-gain, interception, return and defensive-impact reactions.
; Below the atmosphere gate, verified plays use a single sound-only reaction.
; Shake, fuller roars, follow-up cheers and volume bonuses keep their existing fullness gates.
; Includes long gains, interceptions, live native forced-fumble events, confirmed sacks and kickoff returns building from 25 to 35 yards; punt returns keep 30 to 40.
; Long returns keep excited roar/swell layers through the return; the initial cheer is not restarted.
; A missing live-fumble binding retains confirmed post-play reactions.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
DuringPlayReactionsEnabled=1

; Minimum yards gained at the catch for an immediate long-completion reaction: 10-60.
; Default 20. Immediately tackled catches receive a short impact and settling fade.
; Short catches can qualify separately if the receiver turns them into a long gain.
; Catch and carrier coordinates must agree; impossible one-frame runner jumps are rejected.
; Guide: Default 20; range 10-60 yards; whole numbers only.
; Guide: Higher = only deeper catches get the immediate long-catch response; lower = more catches qualify. This is distance at the catch.
LongCompletionMinimumYards=20

; Total gain needed for a run or catch-and-run reaction, measured from the snap: 10-60.
; The cheer triggers at this distance. Shake has its own fixed 11-to-15-yard buildup.
; Gentle shake starts at 11 total yards and targets normal live-play strength at 15.
; Roar and supporting swell build with it; the cheer fires as the gain qualifies.
; Catch-and-runs require actual movement after the catch, not an immediate tackle.
; Sideways cuts do not cancel the reaction once the run qualifies.
; Includes quarterback scrambles; long air-yard catches keep their immediate impact.
; Guide: Default 15; range 10-60 yards; whole numbers only.
; Guide: Higher = the long-gain cheer comes later; lower = sooner. Shake still builds from 11 to 15 total yards.
LongGainMinimumYards=15

; Uses the auditioned native families for catches, gains, takeaways, sacks,
; touchdowns, kicks, disappointment, boos, surprise and anticipation.
; Away successes reuse existing triggers as sound-only home letdowns.
; Variants respect event importance, occupied seats and fullness. Failed IDs13-15
; and23 are never sent; negative catch uses21/22. No new shake triggers.
; Deep passes need 15+ air yards for the existing situational pass route.
; Home defensive deep incompletions/breakups and tackles for loss get a cheer.
; Close made field goals get a cheer; a missed home field goal gets disappointment.
; Neutral games use defensive cheers for either side; no stadium-wide home letdown.
; Available sound-only below the atmosphere gate; earned DGA events may overlap native cheers.
; Once-per-event, freshness, ownership and expiry limits remain.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
SituationalCrowdReactions=1

; Adds anticipation while a verified pass is in flight. Quieter games use a softer supporting swell.
; Uses the existing native gameplay swell with a 0.5-second attack, even if a lineup roar is playing.
; One swell opportunity per pass; settles after catch/incompletion. Requires DuringPlayReactionsEnabled.
; No extra volume bonus, cheer or shake before the result. Fuller atmosphere keeps its existing gates.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
PassFlightAnticipation=1

; Enables qualified stadium-intro atmosphere and extra early-Q1 play-call energy.
; Actual big games get opening buildup from 50% measured fullness, including the intro.
; The normal size-based requirement returns gradually from 10% to 75% through Q1.
; Ordinary opening drives use critical-down fullness: 90% in small venues to 55% in the largest.
; With at least 90% expected peak, the 55% opening discount needs a big game, rivalry,
; or at least 30,000 stored seat positions. Smaller ordinary games keep normal requirements.
; Sparse fresh openings get a modest sound-only welcome without shake or volume premium.
; Ends with the opening possession. Later ordinary drives use their normal requirements.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
OpeningAtmosphere=1

; Enables special eruptions for a first TD within the first two tracked plays, decisive
; late scores, OT winners/takeaways, late defensive takeaways and major upset wins.
; Late takeaways need a one-score lead and enough clock to kneel out the game:
; final 60 seconds with 0-1 opponent timeouts, or final 40 with 2. Any field position.
; Also: touchdown passes snapped in the last 15s of Q2/Q4, 30+ air yards, caught within 5 of goal.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
; Long 60+ yard TDs within eight points receive a modest TD accent, not an eruption.
WinningEruptions=1

; Lets eligible overtime keep its layered crowd sound between snaps.
; Fullness needed scales from 85% at 6,060 positions to 50% at 61,888.
; Qualifying OT adds 10% crowd-shake strength, steady sound across kick/try gaps,
; and confirmed stops, missed opponent field goals and two-point result reactions.
; Fullness/ownership gates remain. Ordinary departures stop in competitive OT.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
OvertimeAtmosphere=1

; Enables play-call roar/swell/cheer layers and ordinary successful-play reactions.
; Eligible calls use roars/swells over 40 seconds. Most calls have no added cheer.
; Home-offense cheers: inside the 10, first home offensive call, first call of a late winning drive.
; Away-offense play-call buildup uses roars/swells only; native game sounds are unchanged.
; A qualified big-game opening kickoff also starts with one immediate cheer.
; Its roar/swell follows the kick and fades for four seconds after the whistle.
; Winning eruptions have their own switch and take priority.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
PlayCallAtmosphere=1

; Separate sound route for a home underdog challenging a Top 25 visitor from Q2 onward.
; Verified ranking gap, score and game stage ease the normal size-based sound gate,
; never below 50% actual seating fullness. Modest Q2 buildup grows with a credible late bid.
; Neutral venues follow either underdog. Unknown ranks cannot qualify this route.
; Uses existing roars/swells, home-only lineup cheers and earned play reactions.
; Does not change packed-house requirements, pre-snap camera gates, attendance or volume caps.
; Default 1; range 0-1. Requires PlayCallAtmosphere. 0 disables this sound route only.
UpsetWatchAtmosphere=1

; Adds gentle shake buildups and short swells for successful trucks, stiff arms,
; and hurdles. Jukes/spins cheer without motion; broken tackles use a sound-only swell.
; Trucks use the native big-hit crowd sound.
; Landed hit-stick shake requires a confirmed third/fourth-down stop. A fresh credited hurdle may settle after the whistle.
; Uses the existing fullness/layered-atmosphere gates. Touchdowns/eruptions take priority.
; Default 1; range 0-1. 1 = enabled, 0 = disabled. Requires DuringPlayReactionsEnabled.
SkillMoveReactions=1

; Major plays and eruptions may add one second cheer about 0.9 seconds later.
; Extra cheers can overlap native voices; each intended layer fires once and never loops.
; Default 1; range 0-1. 1 = enabled, 0 = no delayed second cheer.
StaggeredMajorCheers=1

; Adds context to reactions only in packed ranked/championship games or packed rivalries.
; Close late downs and goal-line plays get stronger reactions; confirmed game-sealing
; stops can erupt and a first down that allows kneeling out the clock gets a scoring-style response.
; Existing fullness gates and volume limits still apply. Ordinary packed games stay unchanged.
; Default 1; range 0-1. 1 = enabled, 0 = standard reactions.
PackedBigGameReactions=1

; Optional extra floor for big-game buildup: 55-90. Default 55 leaves the size curve intact.
; Big games, close critical downs and goal-line tension normally need 90% fullness
; at 6,060 stored positions, scaling to 55% at 61,888. Size endpoints clamp beyond those sizes.
; This floor can raise the normal big-game requirement without changing other routes.
; During big-game openings, the requirement starts at 50% and eases back to this size gate.
; Rivalry alone is not a big game.
; Big games add excitement above the ordinary packed-house foundation, especially in close finishes.
; This does not lower ordinary-game energy or add another volume bonus.
; Overtime and late winning drives instead scale from 85% to 50%.
; Eruptions inherit the qualifying play's requirement. Sound strength follows occupied mapped seats.
; Guide: Default 55; range 55-90 % actual seating fullness; whole numbers only.
; Guide: Higher = big-game buildup normally needs fuller stands; lower = earlier eligibility. Its opening allowance and other size gates stay separate.
BigGameMinimumFullnessPercent=55

; Lets ordinary matchups get play-call buildup based on the stadium's stored seating size.
; Required fullness scales from 98% at 6,060 positions to 60% at 61,888.
; Smaller venues use 98%; larger venues use 60%. Empty positions count toward size.
; This changes atmosphere qualification, not arrivals, attendance or volume caps.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
PackedHouseBuildup=1

; Successful drives strengthen the existing layers; stalls and game time cool them.
; This adds excitement, not another volume bonus. Possession changes/scores reset it.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
DriveEscalation=1

; Legacy compatibility value, ignored by the new bus mix. Chants now follow
; Beds exactly; no independent chant boost/cut is stacked.
ChantMaximumBoostPercent=15

; Reaction boost reference: 0-30% signal. At the stock 30, dense background
; Beds/Chants reach +3.5 dB, rising to +4 dB in the largest packed venues.
; Lower values scale both ceilings; sparse/mid-crowd levels are unchanged.
; 0 also disables added sound layers. Use their individual switches for finer control.
; Guide: Default 30; range 0-30 % audio signal; decimals allowed.
; Higher = stronger dense-crowd lift. Sparse crowd attenuation is mixed on native buses; native excitement is not capped.
MaximumBoostPercent=30

; Legacy reaction-envelope value. It does not add a bus-volume multiplier
; or stack a second gain on the native crowd mix.
HighLeverageBoostPercent=35

; Legacy eruption-envelope value. Native reaction timing/excitement remain,
; but the eruption does not stack a50% bus-volume multiplier.
EruptionBoostPercent=50

[Dynamic Gameday Broadcast]

; Shows Stadium Fullness beside Resume in the regular pause menu.
; Uses the visible seating measurement that controls crowd sound, not attendance remaining.
; Refreshes when the menu opens. -- means a reliable seating measurement is not ready.
; Guide: Default 1; range 0-1. 1 = show; 0 = hide. Reopen the menu after changing this.
PauseMenuFullness=1

; Native Stadium Pulse camera shake follows DGA crowd/context admission.
; This advanced floor may make admission stricter. Default 50; range 0-100.
; 0 preserves native camera behavior (legacy opt-out). Soundscape must be enabled.
; Camera events only: the Pulse meter and gameplay home-field advantage stay unchanged.
; No active DGA cue is required: a qualified venue/situation or earned live context suffices.
; Higher = stricter fullness safeguard; lower does not bypass DGA admission unless zero.
NativeShakeMinimumFullnessPercent=50


; Enables the mod's added camera movement. 0 turns all added types off.
; Respects the game's camera-effects accessibility setting. Gameplay HFA stays native.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
CameraShake=1

; Let visiting fans cause shake after their big plays. Strength follows the fans still seated.
; 1 = on (default); 0 = no visitor shake. Crowd sounds stay active.
AwayTeamReactionShakeEnabled=1

; Crowd shake for BOTH teams at neutral stadiums: 75 is the usual balance.
; 0 = no added crowd shake; 100 = normal home-stadium strength. Cannon shake is separate.
NeutralSiteShakePercent=75

; Wide views and close-ups are normalized automatically on both settings.
; On extends the extreme-wide correction allowance from 4x to 6x, for unusual
; RTG/player views. Leave Off unless those views still feel weak.
; This does not change angle, zoom, native gameplay HFA or other camera settings.
; Guide: Default 0; range 0-1; 0 = off; 1 = on; whole numbers only.
WidePlayerCameraCompensation=0

; Added-shake multipliers for normal team-control gameplay cameras, 0-200%.
; At 100 all cameras use the same screen-motion reference; actual FOV is balanced.
; 50 halves that baseline; 200 doubles it; 0 removes added shake.
; Selects the preset from your offense/defense camera and current controlled side.
; Crowd gates and view compensation still apply, including to post-play effects.
; 100 uses the same calibrated screen-motion baseline for all five cameras.
; Recorded replays stay steady; unknown/player-lock views use automatic normalization
; without borrowing a preference slider from another camera.
StandardCameraShakePercent=100
ZoomCameraShakePercent=100
All22CameraShakePercent=100
WideCameraShakePercent=100
BroadcastCameraShakePercent=100

; Camera movement strengths, not sound volume or Stadium Pulse meter levels.
; All added shake softens on zoomed cameras, including ordinary/critical buildup.
; Qualified crowd motion scales with occupied mapped seats: 0.80x at 6,060 to 1.25x at 61,888 on a linear curve.
; Neutral crowds use 75% of that strength; native cannon impacts remain independent.
; Each accepts 0-100; 0 disables that type. The strongest type leads; independent crowd effects can add up to15% more.
; Maximum ordinary lineup motion. Each call chooses a stable random level from half this value to its maximum.
; Default 5 gives 2.5-5%, chosen once per call; 0 disables it.
; Pre-punt buildup uses half this strength.
; Also used for qualifying overtime/late-drive anticipation on ordinary downs.
; Eligible motion eases in during play selection and continues smoothly into lineup.
; Buildup shakes only the gameplay camera, not separate presentation cutaways.
; Guide: Default 5; range 0-100 %; whole numbers only.
; Guide: Higher = stronger ordinary pre-snap motion; lower = gentler. 0 disables this motion type. Default varies from 2.5% to this ceiling.
OrdinaryShakeStrengthPercent=5

; Random motion ceiling for qualifying close critical downs; packed house is not required.
; Default 10 gives 7.5-10%, chosen once per call; 0 disables it.
; Home-offense critical buildup uses 5.625-7.5%; defense and neutral use 7.5-10% before neutral attenuation.
; Third down needs 10 or fewer yards and an offensive play; fourth down must be going for it.
; Critical fourth-down shake needs an offensive go-for-it play.
; Field goals/punts can use ordinary shake; PATs and other kicks cannot.
; Big-game opening kickoffs are the exception and settle for 2 seconds after the whistle.
; Guide: Default 10; range 0-100 %; whole numbers only.
; Guide: Higher = stronger eligible critical-down motion; lower = gentler. 0 disables it. Default varies from 7.5% to this ceiling.
CriticalShakeStrengthPercent=10

; Motion for a special immediate lineup cheer: 0-100%, default 6 (4-6% before crowd scaling).
; Used inside the 10, on the first home offensive call, or the first call of a late winning drive.
; Guide: Default 6; range 0-100 %; decimals allowed.
; Guide: Higher = stronger shake on the rare added lineup-cheer calls; lower = gentler. Critical-down strength still takes priority.
LineupCheerShakeStrengthPercent=6

; Extra movement on the game's first offensive play when the visitors start with the ball.
; Requires qualifying atmosphere/fullness and a home stadium; it does not repeat later.
; OpeningAtmosphere=0 disables this opening sequence, including its extra motion.
; Default 10 gives a stable 8-10% opening range before occupied-seat scaling.
; The qualifying opening kickoff uses a gentler 6-8% range at this default.
; Guide: Default 10; range 0-30 %; decimals allowed. Higher = stronger; lower = gentler.
; 0 removes this extra strength; ordinary movement remains. CameraShake=0 disables all added motion.
HostileOpeningShakeMaximumPercent=10

; Motion on qualifying long catches/runs, interceptions and 25-to-35-yard kickoff /30-to-40-yard punt return buildups: 0-30%.
; Event ranges distinguish gains (10-12), stops (6-8), losses/conversions (8-10), takeaways (12-14), and forced fumbles (13-15).
; 11 is the live-event reference. This setting scales all those ranges together; effects never stack.
; Guide: Default 11; range 0-30 %; decimals allowed.
; Guide: Higher = stronger eligible run/return/defensive reaction motion; lower = gentler. 0 removes this camera motion, not its sound.
DuringPlayShakeStrengthPercent=11

; Separate strength for stadium cannon blasts at any team using a native cannon effect.
; Independent of Live Play Shake and crowd fullness; respects Dynamic Camera Effects.
; The 0.9-second blast shares existing stronger reactions instead of adding on top.
; Guide: Default 18; range 0-30 %; decimals allowed.
; Guide: Higher = stronger cannon impact; lower = gentler. 0 disables cannon shake, not the cannon sound.
CannonShakeStrengthPercent=18

; Separate impact strength for long catches tackled immediately: 0-30%, default 12.
; Applies at a dead-ball catch or when the whistle follows within 0.35 seconds.
; Long catches with a run afterward use the normal live-play strength instead.
; Earned reactions retain their remaining time through live camera cuts/timeouts.
; Recorded replay footage stays steady; zoomed live cameras receive less movement.
; Guide: Default 12; range 0-30 %; decimals allowed.
; Guide: Higher = stronger immediately tackled long-catch impacts; lower = gentler. Live catch-and-run motion has its own strength.
CatchImpactShakeStrengthPercent=12

; Seconds for live catch/run/turnover/return reactions to settle after the whistle: 1-8.
; Default 5 includes a brief hold, then a smooth fade. TDs/eruptions use separate profiles.
; Guide: Default 5; range 1-8 real seconds; decimals allowed.
; Guide: Higher = longer base settling after the whistle; lower = shorter. Play length does not add any time.
PlayReactionFadeSeconds=5

; Extra seconds for immediately tackled catches, sacks and similar short impacts: 0-5.
; Default 1 gives 2-3-second short impacts, independent of the live-run fade above.
; Short impacts hit quickly, hold briefly, then fade. Live runs/returns use the settling time above.
; Guide: Default 1; range 0-5 real seconds; decimals allowed.
; Guide: Higher = longer short impacts for sacks/immediate catches and similar plays; lower = shorter. 0 removes this extra, not the base fade.
PlayImpactExtraSeconds=1

; Sustained home-touchdown movement, or either team at a neutral site.
; This is the level after the opening hit; eruptions take priority.
; Guide: Default 16; range 0-100 %; whole numbers only.
; Guide: Higher = stronger sustained touchdown/safety shake; lower = gentler. 0 disables these camera profiles, not their audio.
TouchdownShakeStrengthPercent=16

; Sustained eruption movement after its opening hit. Close-up cameras reduce celebration shake automatically.
; It does not stack with the other three types or restart during postgame carry.
; Guide: Default 22.5; range 0-100 %; decimals allowed.
; Guide: Higher = stronger sustained eruption shake; lower = gentler. 0 disables eruption camera motion, not eruption audio.
EruptionShakeStrengthPercent=22.5

; Opening touchdown hit: 0-100. Default 20%, then settles to the 16% level above.
; The opening hit lasts about a second at the default duration.
; Guide: Default 20; range 0-100 %; whole numbers only.
; Guide: Higher = a stronger touchdown/safety opening hit; lower = softer. The opening hit never falls below the sustained strength.
TouchdownShakeImpactPercent=20

; Opening eruption hit: 0-100. Default 30%, then settles to the 22.5% level above.
; Each impact is at least its sustained level; setting the sustained level to 0 disables the type.
; Guide: Default 30; range 0-100 %; whole numbers only.
; Guide: Higher = a stronger eruption opening hit; lower = softer. The opening hit never falls below the sustained strength.
EruptionShakeImpactPercent=30

; Whole touchdown camera effect, including hold and fade: 3-30 seconds.
; Default 11: 20% opening hit, 16% hold through about 6 seconds, then a 5-second fade.
; Qualified safeties/clinching first downs use 16% impact, 12% hold and 70% duration.
; Ordinary blocked field goals use 14/10%; fourth-quarter game-saving blocks use 20/16%.
; Guide: Default 11; range 3-30 real seconds; whole numbers only.
; Guide: Higher = a longer base touchdown effect; lower = shorter. Safeties use 70%; long-play time extends only the fade.
TouchdownShakeDurationSeconds=11

; Whole eruption camera effect: 5-60 seconds.
; Default 16: 30% opening hit, 22.5% hold through about 8 seconds, then an 8-second fade.
; Live camera cuts and timeout scenes keep the remaining duration; zoom is compensated.
; A new snap, pause menu or interactive replay stops celebration shake. Recorded clips stay steady.
; Guide: Default 16; range 5-60 real seconds; whole numbers only.
; Guide: Higher = a longer base eruption camera effect; lower = shorter. Sound has its own longer celebration profile.
EruptionShakeDurationSeconds=16

; Enables the mod's extra post-play replay opportunities.
; Does not turn off the game's existing replays or attendance history in replays.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
ExtraReplaysEnabled=1

; Allows routine runs/completions to use the small replay during play selection.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
InsetAfterRoutinePlays=1

; Encourages the game's full-screen big-play sequences; normal skip controls stay.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
FullScreenBigPlays=1

; Yardage threshold for those full-screen sequences: 10-60 yards.
; Native first-down and special-scene requirements can still affect the selection.
; Guide: Default 12; range 10-60 yards; whole numbers only.
; Guide: Higher = fewer full-screen big-gain replays; lower = more. Native scene rules still apply.
FullScreenMinimumYards=12

; Adds defensive replay opportunities for sacks/TFLs and keeps the native
; interception/lost-fumble presentation. Does not invent turnovers or change stats.
; Guide: Default 1; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 enables this option; 0 disables it.
DefensiveHighlights=1

[Logging]

; Maximum size of EACH readable/technical event log in MB: 1-16. Clears at the limit.
; The launcher log has its own fixed 2 MB limit. No log archives build up.
; Logs/status live in Plugins/DynamicGamedayAtmosphere/Logs/.
; status.txt and DynamicGamedayAtmosphere.log are readable summaries.
; technical-status.txt and technical.log preserve full troubleshooting detail.
; Guide: Default 2; range 1-16 MB; whole numbers only.
; Guide: Higher = more log history before clearing, using more disk space; lower = a shorter log. Launcher logs have a separate fixed limit.
MaxFileMB=2

; Both readable and technical files are always written.
; 0 = normal diagnostic coverage; 1 = extra technical troubleshooting detail.
; Leave at 0 during ordinary play.
; Guide: Default 0; range 0-1 0 = off; 1 = on; whole numbers only.
; Guide: 1 adds extra technical traces; normal troubleshooting detail is retained at 0.
Debug=0
